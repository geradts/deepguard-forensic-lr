# DeepGuard wrapper configuration for the upstream DeepfakeBench FTCN detector.
# Upstream config: training/config/detector/ftcn.yaml
# Do not place model weights in this repository.

deepfakebench:
  checkout: ./external/DeepfakeBench
  detector_config: ./training/config/detector/ftcn.yaml
  test_script: ./training/test.py
  weights: ./training/weights/ftcn_best.pth
  datasets:
    - FaceForensics++
    - Celeb-DF-v2
    - DeepFakeDetection
    - DFDCP
    - UADFV
  compression: c23
  cuda: true

# DeepGuard output contract. Adapt the parser to the exact DeepfakeBench
# result/feature files produced by the installed commit.
output:
  score_column: score
  video_id_column: video_id
  label_column: label
  feature_columns:
    - neural_score_ftcn
  provenance:
    detector: FTCN
    upstream_repository: SCLBD/DeepfakeBench
    upstream_config: training/config/detector/ftcn.yaml
